name: Deploy ExfEdu enquiry Worker

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/enquiry-worker/**"
      - ".github/workflows/deploy-enquiry-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exfedu-enquiry-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy enquiry API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infrastructure/enquiry-worker/package.json

      - name: Validate required deployment settings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID M365_TENANT_ID M365_CLIENT_ID M365_CLIENT_SECRET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Environment secret/variable: ${name}"
              exit 1
            fi
          done

      - name: Install Worker dependencies
        working-directory: infrastructure/enquiry-worker
        run: npm install --no-audit --no-fund

      - name: Deploy Worker with server-side Microsoft secret
        working-directory: infrastructure/enquiry-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/exfedu-enquiry-secrets.json", JSON.stringify({ M365_CLIENT_SECRET: process.env.M365_CLIENT_SECRET }), { mode: 0o600 })'
          npx wrangler deploy \
            --var "M365_TENANT_ID:${M365_TENANT_ID}" \
            --var "M365_CLIENT_ID:${M365_CLIENT_ID}" \
            --secrets-file "${RUNNER_TEMP}/exfedu-enquiry-secrets.json"
          rm -f "${RUNNER_TEMP}/exfedu-enquiry-secrets.json"
